name: Android APK

# Builds the release-signed TaskMint APK and uploads it as a workflow
# artifact. Signing uses the repository secrets RELEASE_KEYSTORE_BASE64
# (base64 of the PKCS12 release keystore), RELEASE_KEYSTORE_PASSWORD and
# RELEASE_KEY_ALIAS. Secret values are never printed to the log.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/release-signing-and-update

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Launcher icons and splash images are generated from the vector
      # sources in assets/ (they are not stored as binaries in git).
      - name: Generate launcher and splash assets
        run: npx -y @capacitor/assets@3.0.5 generate --android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Decode the release keystore from the repository secret into the
      # workspace. The secret value itself is masked by GitHub and is
      # never printed.
      - name: Decode the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/release.p12

      # The Gradle wrapper JAR is generated here (it is not stored in git),
      # then the signed release APK is built. The keystore uses a single
      # password for both the store and the key.
      - name: Generate the Gradle wrapper and build the release APK
        working-directory: android
        env:
          TM_KEYSTORE_FILE: ${{ github.workspace }}/android/release.p12
          TM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TM_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.14.3
          ./gradlew assembleRelease

      # Prints the signing certificate fingerprint into the build log so
      # every release build can be matched to the TaskMint release key.
      - name: Verify the APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: taskmint-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
