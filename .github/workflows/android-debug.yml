name: Android Debug APK

# Builds a debug APK of the Capacitor Android app and uploads it as a
# workflow artifact. The APK is debug-signed only — not for release.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/capacitor-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Launcher icons and splash images are generated from the vector
      # sources in assets/ (they are not stored as binaries in git).
      - name: Generate launcher and splash assets
        run: npx -y @capacitor/assets@3.0.5 generate --android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The Gradle wrapper JAR is generated here (it is not stored in git).
      - name: Generate the Gradle wrapper and build the debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.14.3
          ./gradlew assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taskmint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
