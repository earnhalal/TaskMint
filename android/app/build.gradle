apply plugin: 'com.android.application'

android {
    namespace = "click.taskmint.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "click.taskmint.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "1.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is opt-in: it activates only when a keystore is
    // supplied via Gradle project properties or environment variables
    // (TM_KEYSTORE_FILE etc.), e.g. by CI from repository secrets.
    // Without them, release builds stay unsigned and local builds work
    // exactly as before. The TaskMint release keystore is PKCS12 and uses
    // a single password for both the store and the key.
    signingConfigs {
        release {
            if (project.hasProperty('TM_KEYSTORE_FILE') || System.getenv('TM_KEYSTORE_FILE')) {
                def tmStoreFile = project.findProperty('TM_KEYSTORE_FILE') ?: System.getenv('TM_KEYSTORE_FILE')
                def tmStorePassword = project.findProperty('TM_KEYSTORE_PASSWORD') ?: System.getenv('TM_KEYSTORE_PASSWORD')
                def tmKeyAlias = project.findProperty('TM_KEY_ALIAS') ?: System.getenv('TM_KEY_ALIAS')
                def tmKeyPassword = project.findProperty('TM_KEY_PASSWORD') ?: System.getenv('TM_KEY_PASSWORD') ?: tmStorePassword
                storeFile file(tmStoreFile)
                storePassword tmStorePassword
                keyAlias tmKeyAlias
                keyPassword tmKeyPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('TM_KEYSTORE_FILE') || System.getenv('TM_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Unity Ads SDK — used only through the in-app UnityAdsBridge plugin
    // (click.taskmint.app.UnityAdsBridge). Its game ID / placements are
    // supplied at runtime from the admin panel config; nothing is
    // hardcoded in native code.
    // Unity LevelPlay mediation SDK 9.5 + its Unity Ads adapter. The
    // adapter brings the Unity Ads SDK (com.unity3d.ads:unity-ads)
    // transitively, so the standalone Unity dependency is gone — two
    // copies of the Unity SDK cannot coexist. UnityAdsBridge keeps
    // working against the adapter-bundled SDK classes.
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.5.0'
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.15.0'
    // Play Services pieces LevelPlay needs for GAID / App Set ID.
    implementation 'com.google.android.gms:play-services-appset:16.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.1.0'
    // Start.io (StartApp) InApp SDK — rewarded ads (services/startIoAds.ts)
    implementation 'com.startapp:inapp-sdk:5.4.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
