<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="20.1" y1="26.1" x2="41.5" y2="49.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mint)"/>
  <!-- Second coin peeking from behind -->
  <circle cx="44.4" cy="49.8" r="7.1" fill="#FBBF24" stroke="#B45309" stroke-width="1.2"/>
  <!-- Growth arrow sweeping up -->
  <path d="M15.4,21.3 L24.9,15.4 L30.8,18.7 L43.9,10.1" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45.9,8.6 L38.8,9.4 L43.7,14.9 Z" fill="#FFFFFF"/>
  <!-- Main gold coin -->
  <circle cx="30.8" cy="37.9" r="14.8" fill="url(#gold)" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="30.8" cy="37.9" r="11.9" fill="none" stroke="#D97706" stroke-width="0.9" opacity="0.8"/>
  <!-- Up arrow embossed on the coin -->
  <path d="M30.8,28.4 L36.1,35.3 L33.5,35.3 L33.5,45.6 L28.1,45.6 L28.1,35.3 L25.5,35.3 Z" fill="#065F46"/>
  <!-- Sparkles -->
  <path d="M13.0,29.9 L12.4,32.6 L9.8,33.2 L12.4,33.8 L13.0,36.4 L13.6,33.8 L16.3,33.2 L13.6,32.6 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M51.0,23.6 L50.5,25.6 L48.5,26.1 L50.5,26.5 L51.0,28.6 L51.4,26.5 L53.5,26.1 L51.4,25.6 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
